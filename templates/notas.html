{% extends 'base.html' %}{% block titulo %}Notas{% endblock %}{% block conteudo %}<div class="card mb-4">
    <div class="card-body">
        <h5>Lançar ou atualizar nota</h5>
        <form method="post" id="formLancamentoNota" class="row g-3">
            <div class=" col-md-4"><label>Aluno</label><select name="aluno_id" class="form-select">{% for a in alunos %}
                    <option value="{{ a.id }}">{{ a.nome }}</option>{% endfor %}</select></div>
            <div class=" col-md-3"><label>Disciplina</label><input name="disciplina" class="form-control" required>
            </div>
            <div class=" col-md-2"><label>Bimestre</label><select name="bimestre" class="form-select">{% for n in
                    range(1,5) %}<option value="{{ n }}">{{ n }}º</option>{% endfor %}</select></div>
            <div class=" col-md-2"><label>Nota (0–10)</label><input name="valor" type="number" min="0" max="10"
                    step="0.1" class="form-control" required></div>
            <div class=" col-md-1 d-flex align-items-end"><button id="btnSalvarNota"
                    class="btn btn-primary">Salvar</button></div>
        </form>
    </div>
</div>
<div class="card">
    <div class="card-body table-responsive">
        <table id="tabelaNotas" class="table">
            <thead>
                <tr>
                    <th>Aluno</th>
                    <th>Disciplina</th>
                    <th>Bimestre</th>
                    <th>Nota</th>
                </tr>
            </thead>
            <tbody>{% for n in notas %}<tr>
                    <td>{{ n.aluno.nome }}</td>
                    <td>{{ n.disciplina }}</td>
                    <td>{{ n.bimestre }}º</td>
                    <td>{{ '%.1f'|format(n.valor) }}</td>
                </tr>{% endfor %}</tbody>
        </table>
    </div>
</div>{% endblock %}
