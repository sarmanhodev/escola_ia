{% extends 'base.html' %}{% block titulo %}Turmas{% endblock %}{% block conteudo %}<div class="card mb-4"><div class="card-body"><form method="post" id="formCadastroTurma" class="row g-3"><div class="col-md-5 "><label>Turma</label><input name="nome" class="form-control" placeholder="Ex.: 901" required></div><div class="col-md-4 "><label>Ano letivo</label><input type="number" name="ano_letivo" value="2026" class="form-control" required></div><div class="col-md-3  d-flex align-items-end"><button id="btnCadastrarTurma" class="btn btn-primary w-100">Cadastrar turma</button></div></form></div></div><div class="card"><div class="card-body table-responsive"><table id="tabelaTurmas" class="table"><thead><tr><th>Turma</th><th>Ano</th><th>Alunos</th></tr></thead><tbody>{% for t in turmas %}<tr><td>{{ t.nome }}</td><td>{{ t.ano_letivo }}</td><td>{{ t.alunos|length }}</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
