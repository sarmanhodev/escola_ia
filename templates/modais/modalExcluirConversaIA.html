<!-- MODAL EXCLUIR CONVERSA -->
<div class="modal fade" id="modalExcluirConversaIA" tabindex="-1" aria-labelledby="tituloModalExcluirConversaIA"
    aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content modal-excluir-ia">

            <div class="modal-body">

                <div class="modal-excluir-ia-icone">
                    <i class="fa-solid fa-trash-can"></i>
                </div>

                <h4 id="tituloModalExcluirConversaIA" class="modal-excluir-ia-titulo">
                    Excluir conversa?
                </h4>

                <p class="modal-excluir-ia-descricao">
                    Você está prestes a excluir a conversa
                    selecionada e todas as suas mensagens.
                </p>

                <div class="modal-excluir-ia-aviso">
                    <i class="fa-solid fa-triangle-exclamation"></i>

                    <span>
                        Esta ação é permanente e não poderá
                        ser desfeita.
                    </span>
                </div>

                <div class="modal-excluir-ia-acoes">

                    <button type="button" class="btn btnCancelarExclusaoIA" data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="button" id="btnConfirmarExclusaoIA" class="btn btnConfirmarExclusaoIA">

                        <i class="fa-solid fa-trash-can me-2"></i>
                        Excluir conversa

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
