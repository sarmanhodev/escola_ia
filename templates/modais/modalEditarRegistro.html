<div class="modal fade" id="modalEditarRegistro" tabindex="-1" aria-labelledby="tituloModalEditarRegistro"
    aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content modal-editar-aluno">

            <div class="modal-header">
                <h5 class="modal-title" id="tituloModalEditarRegistro">
                    Editar aluno
                </h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3">

                    <div class="col-md-8">
                        <label for="nomeAlunoEdicao" class="form-label">
                            Nome
                        </label>

                        <input type="text" id="nomeAlunoEdicao" name="nome" class="form-control" required>
                    </div>

                    <div class="col-md-4">
                        <label for="turmaAlunoEdicao" class="form-label">
                            Turma
                        </label>

                        <select id="turmaAlunoEdicao" name="turma_id" class="form-select" required>
                            <option value="">Selecione...</option>
                        </select>
                    </div>

                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">
                    Cancelar
                </button>

                <button type="submit" id="btnSalvarEdicaoAluno" class="btn btn-primary btnSalvarEdicaoAluno">
                    Salvar alterações
                </button>
            </div>
        </div>
    </div>
</div>
